<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latest Lean CI verification</title>
  <style>
    body { max-width: 42rem; margin: 4rem auto; padding: 0 1rem; font: 1rem/1.6 system-ui, sans-serif; }
    h1 { font-size: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Latest Lean CI verification</h1>
    <p id="status" role="status">Open the newest Lean CI run on main.</p>
    <noscript><p>JavaScript is disabled. Open the list below and select the newest run.</p></noscript>
    <p><a href="https://github.com/XinyuanXie-hub/cyclic-lsi-new/actions/workflows/lean.yml?query=branch%3Amain">Open Lean CI runs on main</a></p>
  </main>
  <script>
    (async () => {
      const status = document.getElementById("status");
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);
      status.textContent = "Opening the newest Lean CI run on main…";

      try {
        const response = await fetch(
          "https://api.github.com/repos/XinyuanXie-hub/cyclic-lsi-new/actions/workflows/lean.yml/runs?branch=main&per_page=1",
          {
            headers: { Accept: "application/vnd.github+json" },
            cache: "no-store",
            credentials: "omit",
            signal: controller.signal
          }
        );
        if (!response.ok) throw new Error("GitHub request failed");

        const data = await response.json();
        const run = data.workflow_runs?.[0];
        if (!run) {
          status.textContent = "No Lean CI runs on main are available yet. Use the link below to check again.";
          return;
        }
        if (
          run.head_branch !== "main" ||
          typeof run.html_url !== "string" ||
          !/^https:\/\/github\.com\/XinyuanXie-hub\/cyclic-lsi-new\/actions\/runs\/[1-9]\d*$/.test(run.html_url)
        ) {
          throw new Error("Unexpected run URL");
        }

        window.location.replace(run.html_url);
      } catch {
        status.textContent = "The newest run could not be opened automatically. Use the link below to view the runs.";
      } finally {
        clearTimeout(timeout);
      }
    })();
  </script>
</body>
</html>
